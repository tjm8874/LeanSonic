      - "Owner AI: Claude"
      - "リポジトリのファイルは変更しない（結果は notes/T001-baseline.md に記録）"
      - "CUDA_DEVICE_ORDER=PCI_BUS_ID か GPU UUID で固定し、エンジンのログに出るデバイス名と照合する"
      - "計測前に nvidia-smi で使用状況を確認し、他の AI が使用中の GPU は避ける"
    expected_output:
      - "4 GPU × 指標の現状値と目標との差（倍率）"
      - "5060 Ti の補正後の目標案"
      - "各 GPU の nsys 上位 kernel（律速の再確認）"
    receipt: null
  - id: T002
    type: worker
    assignee: Worker
    status: queued
    reasoning_hint: medium
    objective: "goal oracle の `leansonic bench-matrix` サブコマンドを実装する。目標表を docs/benchmarks/targets.json に置き、指定 GPU で bench を実行し、ABBA N>=5 の中央値と 95% ブートストラップ CI から、各セルの PASS/FAIL と差分を表と JSON で出力する"
    inputs:
      - "T001 receipt"
      - "crates/leansonic-cli/src/main.rs（既存の bench）"
    constraints:
      - "Owner AI: Claude"
      - "サードパーティ依存ゼロ（ブートストラップも std だけで実装）"
      - "出力 JSON に commit・GPU 名・UUID・driver・電力上限・入力 token ID のハッシュを含める（公開 PR には UUID を載せない）"
    allowed_files:
      - "crates/leansonic-cli/src/main.rs"
      - "crates/leansonic-cli/src/bench_matrix.rs"
      - "docs/benchmarks/targets.json"
      - "docs/benchmarks/README.md"
