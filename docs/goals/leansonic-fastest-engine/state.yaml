# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "LeanSonic: 4 GPU で外部エンジン以上の速度・最小VRAM・証明された正しさ"
  slug: "leansonic-fastest-engine"
  kind: existing_plan
  tranche: "継続実行。計測基盤（T001/T002/T005）と P0（#9 → #10）から始め、各 tranche の終わりに bench-matrix の FAIL が多い分野から次の Worker パッケージを選ぶ"
  status: active
  oracle:
    signal: "leansonic bench-matrix --gpus all が 4 GPU × 目標表の全セルで PASS（ABBA N>=5 の 95%CI 下限 >= 目標）"
    cadence: "after each Worker package and at final audit"
    final_proof: "docs/benchmarks/ に全セルの ABBA JSON（commit・GPU UUID・driver・電力上限・入力 token ID）と KLD / needle レポート、全 PR マージ済み、Release v0.3.0 にバイナリ添付"
  intake:
    original_request: "Goal Prep で、世界最速・最軽量・高信頼性・メモリ節約、RTX Pro でも eGPU 相当の 5060 Ti でも動く LLM 推論エンジン構築（3 AI 協働）"
    interpreted_outcome: "LeanSonic の Inkling-2-Mini 推論が、4 枚の手持ち Blackwell GPU それぞれで外部エンジンの実測最良値以上の速度、最小 VRAM、0-ULP / KLD で証明された正しさを、同じリリースバイナリで満たす"
    input_shape: existing_plan
    audience: "リポジトリのオーナー（Toyo）と 3 AI（Gemini・Codex・Claude）"
    authority: approved
    proof_type: metric
    completion_proof: "bench-matrix の全セル PASS と、それを裏付ける docs/benchmarks/ の証跡、および Release v0.3.0"
    likely_misfire: "1 GPU や合成プロンプトだけで最速と判断する／精度を落として速度を稼ぐ／GPU 番号の取り違え／他の AI の計測と GPU を共有する／Issue 作成だけで完了扱いにする"
    blind_spots_considered:
      - "5060 Ti の目標は推定値。T001 で実測して補正する"
      - "16GB 機では Spilled 転送（Gen4 x16 / x4）が支配的"
      - "48 visit のループで 1-ULP の差が logits に最大 ±4 ほど増幅される"
      - "cudaserver の既存 Python サービスは止めない"
      - "Gemini が #5 を別ブランチで作業中"
      - "凍結コア（Axioms.lean, ci/, .github/, CODEOWNERS, benches/goldens/）は変更不可"
    existing_plan_facts:
      - "優先順: P0 #9 -> #10、P1 #11 -> #5 -> #12 -> #13、P2 #14、P3 #15"
      - "Issue #8 が tracking。目標表は goal.md と同一"
      - "PRO 5000 の現状（f34a08e + PR #9）: Prefill 1K 1,036 tok/s、Decode 151 tok/s、16K 136 tok/s"
      - "Prefill の律速は grouped MoE の dp4a SIMT（約 56%）。Decode は 1 トークンあたり約 1,157 kernel、glue が約 2.3 ms"
      - "cuda01: idx0 = RTX PRO 4500、idx1 = RTX PRO 5000（PCI_BUS_ID 順）。cudaserver: idx0 = RTX 5070 Ti、idx1 = RTX 5060 Ti"

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: unknown
  worker: unknown
  judge: unknown

visual_board:
  selected: unknown
  local:
    status: not_requested
    url: null
    command: "node <skill-path>/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/leansonic-fastest-engine"

active_task: T001

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: active
    reasoning_hint: medium
    objective: "main の最新 commit で、4 GPU × 目標表のうち今測れるセル（Prefill 2K/16K、非投機 Decode 短文/16K、VRAM、常駐層数）を ABBA N>=5 で計測し、5060 Ti の推定目標を実測で補正する"
    inputs:
      - "docs/goals/leansonic-fastest-engine/goal.md"
      - "Issue #8（目標表と外部エンジンの値）"
      - "cuda01 / cudaserver の ~/leansonic-claude-20261126/（既存の計測スクリプトとログ）"
